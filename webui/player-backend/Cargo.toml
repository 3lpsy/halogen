[package]
name = "halogen-webui-player-backend"
version.workspace = true
edition.workspace = true

[dependencies]
halogen-webui-player-types = { path = "../player-types" }
dioxus = { workspace = true, features = ["router"] }
halogen-webui-app-state = { path = "../app-state" }
halogen-webui-logging = { path = "../logging" }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Navigator", "HtmlMediaElement", "HtmlAudioElement", "MediaError",
    "Document", "Element", "Node", "Event", "EventTarget", "Url"] }

[features]
web = ["dioxus/web", "halogen-webui-app-state/web", "halogen-webui-logging/web", "halogen-webui-player-types/web"]
desktop = ["dioxus/desktop", "halogen-webui-app-state/desktop", "halogen-webui-logging/desktop", "halogen-webui-player-types/desktop"]

[dev-dependencies]
anyhow = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true }
