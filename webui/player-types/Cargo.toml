[package]
name = "halogen-webui-player-types"
version.workspace = true
edition.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["router"] }
halogen-webui-media = { path = "../media" }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Navigator", "HtmlMediaElement", "HtmlAudioElement", "MediaError",
    "Document", "Element", "Node", "Event", "EventTarget", "Url"] }

[features]
web = ["dioxus/web", "halogen-webui-media/web"]
desktop = ["dioxus/desktop", "halogen-webui-media/desktop"]

[dev-dependencies]
anyhow = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true }
