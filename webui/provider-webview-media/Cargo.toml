[package]
name = "halogen-webui-provider-webview-media"
version.workspace = true
edition.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["router"] }
halogen-webui-app-state = { path = "../app-state" }
halogen-webui-logging = { path = "../logging" }
halogen-webui-config = { path = "../config" }
halogen-webui-media = { path = "../media" }
halogen-webui-player = { path = "../player" }
halogen-apiclient = { path = "../../crates/apiclient" }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
axum = { workspace = true }
rand = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Document", "Location", "History", "Storage",
    "Element", "HtmlElement", "Event", "EventTarget"] }

[features]
web = ["dioxus/web", "halogen-webui-app-state/web", "halogen-webui-config/web", "halogen-webui-logging/web", "halogen-webui-media/web", "halogen-webui-player/web"]
desktop = ["dioxus/desktop", "halogen-webui-app-state/desktop", "halogen-webui-config/desktop", "halogen-webui-logging/desktop", "halogen-webui-media/desktop", "halogen-webui-player/desktop"]
