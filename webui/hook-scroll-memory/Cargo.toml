[package]
name = "halogen-webui-hook-scroll-memory"
version.workspace = true
edition.workspace = true

[dependencies]
halogen-webui-hook-paged-pool = { path = "../hook-paged-pool" }
halogen-webui-hook-dom-stream = { path = "../hook-dom-stream" }
dioxus = { workspace = true, features = ["router"] }
halogen-webui-listview = { path = "../listview" }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
axum = { workspace = true }
rand = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Document", "Location", "History", "Storage",
    "Element", "HtmlElement", "Event", "EventTarget"] }

[features]
web = ["dioxus/web", "halogen-webui-hook-dom-stream/web", "halogen-webui-hook-paged-pool/web", "halogen-webui-listview/web"]
desktop = ["dioxus/desktop", "halogen-webui-hook-dom-stream/desktop", "halogen-webui-hook-paged-pool/desktop", "halogen-webui-listview/desktop"]
