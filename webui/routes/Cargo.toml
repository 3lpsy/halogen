[package]
name = "halogen-webui-routes"
version.workspace = true
edition.workspace = true

[dependencies]
halogen-webui-page-app = { path = "../page-app" }
halogen-webui-component-navigation = { path = "../component-navigation" }
halogen-webui-provider-app = { path = "../provider-app" }
halogen-webui-hooks = { path = "../hooks" }
halogen-webui-provider-local = { path = "../provider-local" }
