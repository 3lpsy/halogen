[package]
name = "halogen-webui-view-configure-swipes"
version.workspace = true
edition.workspace = true

[dependencies]
halogen-webui-hooks = { path = "../hooks" }
dioxus = { workspace = true, features = ["router"] }
halogen-webui-config = { path = "../config" }
halogen-webui-component-widgets = { path = "../component-widgets" }
halogen-webui-episode-list = { path = "../episode-list" }
url = { workspace = true }
chrono = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["Window", "Document", "Location", "History"] }

[dev-dependencies]
futures = { workspace = true }

[features]
web = ["dioxus/web", "halogen-webui-component-widgets/web", "halogen-webui-config/web", "halogen-webui-episode-list/web", "halogen-webui-hooks/web"]
desktop = ["dioxus/desktop", "halogen-webui-component-widgets/desktop", "halogen-webui-config/desktop", "halogen-webui-episode-list/desktop", "halogen-webui-hooks/desktop"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true }
