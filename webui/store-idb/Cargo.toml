[package]
name = "halogen-webui-store-idb"
version.workspace = true
edition.workspace = true

# Shared IndexedDB foundation for the web stores: the low-level ceremony, typed
# JSON-record helpers, and the versioned-schema `open`/migration framework.
# Deps are wasm-gated (native builds get an empty crate). Deliberately holds NO
# dependency on `halogen-webui-logging` (which depends on this) — it stays a leaf.
[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
idb = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
# IdbRequest/IdbTransaction: clear event handlers on drop (`guarded`, guard.rs;
# idb 0.6.5 leaves them dangling on cancel). IdbDatabase/EventTarget/console:
# the versionchange close handler + blocked-open diagnostics (raw `console`
# because ui-logging depends on this crate).
web-sys = { workspace = true, features = [
    "IdbRequest", "IdbTransaction", "IdbDatabase", "EventTarget", "console"] }
# Racing an open/delete against the blocked-state timeout (src/schema.rs).
gloo-timers = { workspace = true }
futures-util = { workspace = true }
