[package]
name = "halogen-webui-hook-list-view-state"
version.workspace = true
edition.workspace = true

[dependencies]
halogen-webui-hook-latest-wins = { path = "../hook-latest-wins" }
dioxus = { workspace = true, features = ["router"] }
halogen-webui-listview = { path = "../listview" }
halogen-webui-platform = { path = "../platform" }
halogen-webui-config = { path = "../config" }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
axum = { workspace = true }
rand = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Document", "Location", "History", "Storage",
    "Element", "HtmlElement", "Event", "EventTarget"] }

[features]
web = ["dioxus/web", "halogen-webui-config/web", "halogen-webui-hook-latest-wins/web", "halogen-webui-listview/web", "halogen-webui-platform/web"]
desktop = ["dioxus/desktop", "halogen-webui-config/desktop", "halogen-webui-hook-latest-wins/desktop", "halogen-webui-listview/desktop", "halogen-webui-platform/desktop"]
