<div class="row">
<figure id="S1" class="">
<span class="fid">S1 · iOS · Shared rows</span>
<div class="phone ">
<div data-status>
</div>
<header class="appbar">
<span class="leading">
</span>
<h2>Halogen</h2>
<span class="trailing">
<span class="dot">
</span>
<span class="blue" data-icon="account">
</span>
</span>
</header>
<main class="content">
<div class="podcast">
<div class="art acquired " role="img" aria-label="Acquired artwork">
</div>
<div class="grow">
<span class="title">Acquired</span>
<span class=meta>Ben Gilbert and David Rosenthal</span>
<span class=meta>10 episodes</span>
</div>
<span class="blue" data-icon="dots">
</span>
</div>
<div class="episode">

<img class="art " src="assets/ferrari.jpg" alt="Ferrari artwork">
<div class="grow">
<span class="title">Ferrari</span>
<span class=meta>Acquired</span>
</div>
<span class="chevron">›</span>
</div>

<div class="episode-actions">
<span class="blue" data-icon="play">
</span>
<span class="blue" data-icon="download">
</span>
<span>3 hr 59 min · 5 months ago</span>
<span class="dots">
<span class="blue" data-icon="dots">
</span>
</span>
</div>
</div>
<div class="group-label">Playback</div>
<div class="group">
<div class="setting">
<span class="grow">Skip forward</span>
<span class="value">30s</span>
</div>
<div class="setting">
<span class="grow">Auto-play next in queue</span>
<span class="value">
<span class="switch">
</span>
</span>
</div>
</div>
</main>
<div data-mini>
</div>
<div data-tabs="Podcasts">
</div>
</div>
<figcaption>Podcast and episode rows, grouped form, player and dock. These are the existing native component families.</figcaption>
</figure>
<figure id="S2" class="">
<span class="fid">S2 · Mobile web · Shared shell</span>

<div class="browserbar">podcasts.example.com</div>
<header class="appbar">
<span class="leading">
</span>
<h2>Halogen</h2>
<span class="trailing">
<span class="dot">
</span>
<span class="blue" data-icon="account">
</span>
</span>
</header>
<main class="content">
<div class="toolbar">
<span class="blue" data-icon="sort">
</span>
<span class="blue" data-icon="filter">
</span>
<span class="last">
<span class="blue" data-icon="search">
</span>
</span>
</div>
<div class="episode">
<div class="episode-head">
<div class="art " data-icon="wave">
</div>
<div class="grow">
<span class="title">FreeBSD with John Baldwin</span>
<span class=meta>Software Engineering Daily</span>
</div>
<span class="chevron">›</span>
</div>

<span class="blue" data-icon="play">
</span>
<span class="blue" data-icon="download">
