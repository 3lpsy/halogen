[package]
name = "halogen-ui-appstate"
version.workspace = true
edition.workspace = true

# Reactive application-state data: `EpisodeState` (worker-written, UI-read) +
# the per-domain state slices, status enums, media/art URL builders, and the
# ephemeral `DiscoverState`. Pure data types (no async/platform/renderer);
# held as signals by the providers in ui-state. A leaf of the UI graph.
[dependencies]
halogen-wire = { path = "../wire" }
chrono = { workspace = true }
serde = { workspace = true }
