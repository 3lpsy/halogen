[package]
name = "halogen-ui-forms"
version.workspace = true
edition.workspace = true

# The shared reactive-form error type (`FormErrors`). Pure data (no renderer) that
# normalizes local `validator` errors + server `ApiError`s into one field->messages
# map, shared by the `use_form` hook (ui-state) and the form field components
# (ui-widgets). A leaf of the UI crate graph.
[dependencies]
halogen-api = { path = "../api" }
halogen-wire = { path = "../wire" }
