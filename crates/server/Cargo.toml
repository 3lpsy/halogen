[package]
name = "halogen-server"
version.workspace = true
edition.workspace = true

[dependencies]
halogen-handlers = { path = "../handlers" }
halogen-routes = { path = "../routes" }
halogen-router = { path = "../router" }
halogen-logging = { path = "../logging" }
halogen-runtime-control = { path = "../runtime-control" }
halogen-config = { path = "../config" }
halogen-migrations = { path = "../migrations" }
halogen-fixture = { path = "../fixture" }
halogen-orm = { path = "../orm" }
halogen-net = { path = "../net" }
halogen-download = { path = "../download" }
halogen-polling = { path = "../polling" }
halogen-opml = { path = "../opml" }
axum = { workspace = true }
sea-orm = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tower = "0.5.3"
# Serve precompressed assets and gzip other static responses.
tower-http = { version = "0.6", features = ["fs", "cors", "set-header", "compression-gzip"] }
rust-embed = { version = "8", optional = true, features = ["mime-guess", "debug-embed", "compression"] }

[features]
# Bundles the prebuilt frontend (`<workspace>/dist`) into the binary and serves
# it from memory (production single-binary + browser E2E). Build `dist/` first
# with `just ui-build`; this feature never invokes dx.
embed-frontend = ["dep:rust-embed"]
# Dev seeding in a RELEASE binary — only for the e2e harness server (the
# release pipeline's gate). Never enable for shipped builds.
dev-seed = ["halogen-fixture/dev-seed"]

[build-dependencies]
sha2 = "0.10.9"
