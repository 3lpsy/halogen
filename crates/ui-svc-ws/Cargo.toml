[package]
name = "halogen-ui-svc-ws"
version.workspace = true
edition.workspace = true

# The connectivity WebSocket service: the `WsConn` transport (native
# tokio-tungstenite / web gloo-net), reconnect `backoff`, and the `driver` that
# emits `ConnectionEvent`s. Renderer-agnostic; the sync worker maps its events to
# app state. rustls only on native (workspace TLS invariant).
[dependencies]
halogen-api = { path = "../api" }
halogen-ui-logging = { path = "../ui-logging" }
halogen-ui-platform = { path = "../ui-platform" }
async-trait = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { workspace = true }
js-sys = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-webpki-roots"] }
