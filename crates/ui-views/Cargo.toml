[package]
name = "halogen-ui-views"
version.workspace = true
edition.workspace = true

# The Route-coupled top of the view layer: the Route enum + router glue, all pages,
# layouts, and the navigating "smart" components. Depends on every lower UI crate.
[dependencies]
dioxus = { workspace = true, features = ["router"] }
halogen-ui-commands = { path = "../ui-commands" }
halogen-ui-toast = { path = "../ui-toast" }
halogen-ui-appstate = { path = "../ui-appstate" }
halogen-ui-platform = { path = "../ui-platform" }
halogen-ui-logging = { path = "../ui-logging" }
halogen-ui-config = { path = "../ui-config" }
halogen-ui-svc-player = { path = "../ui-svc-player" }
halogen-ui-cache-purge = { path = "../ui-cache-purge" }
halogen-ui-accounts = { path = "../ui-accounts" }
halogen-ui-state = { path = "../ui-state" }
halogen-ui-widgets = { path = "../ui-widgets" }
halogen-ui-episode-list = { path = "../ui-episode-list" }
halogen-ui-icons = { path = "../ui-icons" }
halogen-api = { path = "../api" }
halogen-wire = { path = "../wire" }
halogen-utils = { path = "../utils" }
url = { workspace = true }
# Timestamp formatting on the metadata pages (wasm-safe; wire already carries it).
chrono = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["Window", "Document", "Location", "History"] }

[dev-dependencies]
# The detail-route render-settlement tests in `app.rs` drive a native VirtualDom
# under `#[tokio::test]`; page/filter tests build timestamps + drive streams.
tokio = { workspace = true }
futures = { workspace = true }

[features]
web = ["dioxus/web", "halogen-ui-toast/web", "halogen-ui-config/web", "halogen-ui-svc-player/web", "halogen-ui-accounts/web", "halogen-ui-state/web", "halogen-ui-widgets/web", "halogen-ui-episode-list/web", "halogen-ui-icons/web"]
desktop = ["dioxus/desktop", "halogen-ui-toast/desktop", "halogen-ui-config/desktop", "halogen-ui-svc-player/desktop", "halogen-ui-accounts/desktop", "halogen-ui-state/desktop", "halogen-ui-widgets/desktop", "halogen-ui-episode-list/desktop", "halogen-ui-icons/desktop"]
