[package]
name = "halogen-ui-state"
version.workspace = true
edition.workspace = true

# The reactive coordination layer: context providers (account/config/state/worker/
# player/toast/discover), the typed hooks that read them, and the worker-command
# façade. Sits between the data/service crates and the view layer — it wires the
# sync worker, so it's the one crate that depends on the heavy ui-svc-sync.
[dependencies]
dioxus = { workspace = true, features = ["router"] }
halogen-ui-commands = { path = "../ui-commands" }
halogen-ui-forms = { path = "../ui-forms" }
halogen-ui-listview = { path = "../ui-listview" }
halogen-ui-toast = { path = "../ui-toast" }
halogen-ui-appstate = { path = "../ui-appstate" }
halogen-ui-platform = { path = "../ui-platform" }
halogen-ui-logging = { path = "../ui-logging" }
halogen-ui-config = { path = "../ui-config" }
halogen-ui-svc-store = { path = "../ui-svc-store" }
halogen-ui-svc-media = { path = "../ui-svc-media" }
halogen-ui-svc-sync = { path = "../ui-svc-sync" }
halogen-ui-svc-player = { path = "../ui-svc-player" }
halogen-ui-accounts = { path = "../ui-accounts" }
halogen-api = { path = "../api" }
halogen-wire = { path = "../wire" }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# WebviewMediaBridge: the loopback media server (webview media stacks can only
# stream <audio> over http, not custom schemes) + its URL nonce.
tokio = { workspace = true }
axum = { workspace = true }
rand = { workspace = true }
# Embedded Server mode (the in-process full server). Optional: pulled in only
# by the `embedded-server` feature, which the desktop chain enables —
# renderless test builds compile the stub facade instead.
halogen-embedded-server = { path = "../embedded-server", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Document", "Location", "History", "Storage",
    "Element", "HtmlElement", "Event", "EventTarget",
] }

[features]
# The in-process Embedded Server (native only; never in the wasm graph).
embedded-server = ["dep:halogen-embedded-server"]
web = ["dioxus/web", "halogen-ui-toast/web", "halogen-ui-config/web", "halogen-ui-svc-sync/web", "halogen-ui-svc-player/web", "halogen-ui-accounts/web"]
desktop = ["dioxus/desktop", "halogen-ui-toast/desktop", "halogen-ui-config/desktop", "halogen-ui-svc-sync/desktop", "halogen-ui-svc-player/desktop", "halogen-ui-accounts/desktop"]
