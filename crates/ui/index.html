<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!-- No `maximum-scale`/`user-scalable=no`: blocking pinch-zoom this way is a
             Lighthouse a11y failure ([user-scalable="no"] audit) AND iOS Safari ignores
             it anyway. Zoom gestures are instead suppressed by the script below, but
             ONLY in the installed (standalone) PWA — see there. viewport-fit=cover stays
             for the iOS notch/safe-area insets. -->
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <!-- Pre-paint UI font-size scaling. The app scales the whole UI by setting a
             root `font-size` % (everything is rem-based) from the user's config — but
             config loads asynchronously, so doing it only after mount reflowed the
             entire painted page in one go (a large CLS). Apply it here, before first
             paint, from a synchronous localStorage mirror that the app keeps current
             (see AppLayout's font-size effect). Default 125% matches `FontSize::Medium`,
             so a first-time / logged-out visitor paints at the right size with no shift.
             Allowed under the frontend CSP (`script-src 'unsafe-inline'`). -->
        <script>
          (function () {
            try {
              document.documentElement.style.fontSize =
                localStorage.getItem("halogen.fontsize") || "125%";
            } catch (e) {}
          })();
        </script>
        <!-- With a custom index.html, dx APPENDS Dioxus.toml [web.app] title to this
             <title>'s text (rather than replacing it), so that key is emptied there to
             avoid "HalogenHalogen". The web title is owned here. -->
        <title>Halogen</title>
        <!-- PWA: served from the dist root (copied there from crates/ui/pwa/ by
             the justfile _sync-dist recipe). Static in the template so crawlers /
             Lighthouse see them pre-hydration, not just after Dioxus mounts. -->
        <link rel="manifest" href="/manifest.webmanifest" />
        <!-- SVG favicon first (crisp at any size); .ico is the legacy fallback. -->
        <link rel="icon" href="/icon.svg" type="image/svg+xml" />
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <!-- Matches the brand icon's dark field (data/assets/icon.svg) and the
             manifest's background_color/theme_color. -->
        <meta name="theme-color" content="#0B0E14" />
        <meta name="color-scheme" content="dark" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Halogen" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <!-- Installed-PWA-only zoom suppression. In a home-screen / standalone app,
             pinch-zoom and double-tap-zoom make a native-feeling UI feel broken (and
             can't be re-centered), so we disable them — but ONLY when launched
             standalone, so the normal browser tab keeps zoom for accessibility (and so
             Lighthouse, which audits the browser tab, never sees zoom disabled).
             Allowed under the frontend CSP (`script-src 'unsafe-inline'`). -->
        <script>
          (function () {
            var standalone =
              window.navigator.standalone === true ||
              (window.matchMedia &&
                window.matchMedia("(display-mode: standalone)").matches);
            if (!standalone) return;
            // Double-tap-zoom: iOS honors `touch-action` for it. `pan-x pan-y` on the
            // root disables double-tap while allowing scrolling; descendants stay free
            // to be MORE restrictive (e.g. the swipe rows' `touch-action: none`).
            document.documentElement.style.touchAction = "pan-x pan-y";
            // Pinch-zoom: iOS ignores `touch-action` for the pinch gesture, so block its
            // non-standard `gesture*` events directly. `passive: false` so
            // preventDefault() actually takes effect.
            ["gesturestart", "gesturechange", "gestureend"].forEach(function (evt) {
              document.addEventListener(
                evt,
                function (e) {
                  e.preventDefault();
                },
                { passive: false },
              );
            });
          })();
        </script>
    </head>
    <body>
        <div id="main"></div>
    </body>
</html>
