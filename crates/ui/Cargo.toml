[package]
name = "halogen-ui"
version.workspace = true
authors = ["opencode <opencode@local>"]
edition.workspace = true

# Launch shim only: boots `App` and wires the feature chain; the heavy lifting
# lives in the `halogen-ui-*` crates. ui-icons/ui-widgets/ui-episode-list are
# listed only to forward the renderer feature (see `[features]`).
[dependencies]
dioxus = { workspace = true, features = ["router"] }
halogen-ui-icons = { path = "../ui-icons" }
halogen-ui-appstate = { path = "../ui-appstate" }
halogen-ui-logging = { path = "../ui-logging" }
halogen-ui-state = { path = "../ui-state" }
halogen-ui-widgets = { path = "../ui-widgets" }
halogen-ui-episode-list = { path = "../ui-episode-list" }
halogen-ui-views = { path = "../ui-views" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# getrandom 0.3 needs the `wasm_js` backend on wasm. The feature here enables it
# in the dep graph; the matching `getrandom_backend="wasm_js"` cfg is set for the
# wasm target in `.cargo/config.toml` (both are required).
getrandom = { workspace = true }
# The only direct web-sys use here is the PWA service-worker registration in
# `main`. The byte store / device-log / cache-purge web-sys usage lives in the
# `halogen-ui-svc-*` / `halogen-ui-cache-purge` crates (which enable their own features).
web-sys = { workspace = true, features = [
    "Window", "Navigator", "ServiceWorkerContainer", "ServiceWorker", "ServiceWorkerRegistration",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Only used by the in-crate `render_semantics` tests (#[tokio::test] + timeout).
tokio = { workspace = true }
# Desktop launch config points the webview data dir at our data root.
halogen-ui-platform = { path = "../ui-platform" }

[dev-dependencies]
dioxus = { workspace = true, features = ["router", "web"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
# web (wasm) is the primary target and the default so plain `cargo`/`dx` commands
# and the native `cargo check --workspace` doesn't drag in the heavy desktop
# webview tree (wry/tao/webkit/gtk/...). Build desktop explicitly with
# `--no-default-features --features desktop`.
default = ["web"]
web = ["dioxus/web", "halogen-ui-icons/web", "halogen-ui-state/web", "halogen-ui-widgets/web", "halogen-ui-episode-list/web", "halogen-ui-views/web"]
desktop = ["dioxus/desktop", "halogen-ui-icons/desktop", "halogen-ui-state/desktop", "halogen-ui-state/embedded-server", "halogen-ui-widgets/desktop", "halogen-ui-episode-list/desktop", "halogen-ui-views/desktop"]
