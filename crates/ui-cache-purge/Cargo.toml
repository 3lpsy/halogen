[package]
name = "halogen-ui-cache-purge"
version.workspace = true
edition.workspace = true

# Direct browser-storage purges for the `/cache-control` failsafe page: device
# audio/logs, the IndexedDB stores, Cache Storage, and the service worker —
# never through the sync worker, so they work even when the data layer is
# wedged. On native the browser-only actions no-op; audio/log purges run.
[dependencies]
halogen-ui-logging = { path = "../ui-logging" }
halogen-ui-svc-media = { path = "../ui-svc-media" }
halogen-ui-platform = { path = "../ui-platform" }
halogen-ui-idb = { path = "../ui-idb" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
idb = { workspace = true }
serde_json = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Location", "Navigator",
    "ServiceWorkerContainer", "ServiceWorker", "ServiceWorkerRegistration",
    "CacheStorage",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The /cache-control failsafe opens each account's store DB directly (never
# through the worker) for the content / sync-queue clears.
halogen-ui-svc-store = { path = "../ui-svc-store" }

[dev-dependencies]
futures = { workspace = true }
