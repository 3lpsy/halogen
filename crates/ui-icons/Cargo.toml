[package]
name = "halogen-ui-icons"
version.workspace = true
edition.workspace = true

# Pure SVG icon components — the leaf of the UI crate graph. Only needs dioxus
# core (`#[component]` + `rsx!`); no router, no platform deps. The web/desktop
# features forward to the matching dioxus renderer so the feature chain threads down
# from the `halogen-ui` root (see crates/ui/Cargo.toml).
[dependencies]
dioxus = { workspace = true }

[features]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
