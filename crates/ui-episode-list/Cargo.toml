[package]
name = "halogen-ui-episode-list"
version.workspace = true
edition.workspace = true

# The episode-list component cluster + its per-row context menu. Route-free (uses
# path-string navigation), so it sits below ui-views and can compile in parallel
# with the rest of the view layer.
[dependencies]
dioxus = { workspace = true, features = ["router"] }
halogen-api = { path = "../api" }
halogen-ui-listview = { path = "../ui-listview" }
halogen-ui-appstate = { path = "../ui-appstate" }
halogen-ui-commands = { path = "../ui-commands" }
halogen-ui-config = { path = "../ui-config" }
halogen-ui-logging = { path = "../ui-logging" }
halogen-ui-platform = { path = "../ui-platform" }
halogen-ui-svc-store = { path = "../ui-svc-store" }
halogen-ui-svc-player = { path = "../ui-svc-player" }
halogen-ui-state = { path = "../ui-state" }
halogen-ui-widgets = { path = "../ui-widgets" }
halogen-ui-icons = { path = "../ui-icons" }
halogen-wire = { path = "../wire" }

[dev-dependencies]
# Test modules build synthetic episode timestamps.
chrono = { workspace = true }

[features]
web = ["dioxus/web", "halogen-ui-config/web", "halogen-ui-svc-player/web", "halogen-ui-state/web", "halogen-ui-widgets/web", "halogen-ui-icons/web"]
desktop = ["dioxus/desktop", "halogen-ui-config/desktop", "halogen-ui-svc-player/desktop", "halogen-ui-state/desktop", "halogen-ui-widgets/desktop", "halogen-ui-icons/desktop"]
