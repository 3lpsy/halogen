[package]
name    = "halogen-mobile-ffi"
version.workspace = true
edition.workspace = true

# The native-mobile FFI boundary: the Rust core both native apps link, exposed
# over UniFFI bindings (Swift for `ios/`, Kotlin for `android/`); hosts the
# local profiles, shared sync, and device logs. crate-type: staticlib (iOS),
# cdylib (the Android .so + uniffi-bindgen host metadata), lib (workspace tests).
[lib]
name = "halogen_mobile"
crate-type = ["lib", "staticlib", "cdylib"]

# Bindings generator (host-only tool): `cargo run -p halogen-mobile-ffi
# --features bindgen --bin uniffi-bindgen -- generate --library ...`.
# Feature-gated so device-target builds never compile uniffi's CLI (clap etc).
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["bindgen"]

[dependencies]
halogen-sync-policy = { path = "../sync-policy" }
halogen-sync = { path = "../sync" }
halogen-sync-store = { path = "../sync-store" }
halogen-sync-journal = { path = "../sync-journal" }
halogen-apiclient = { path = "../apiclient" }
serde_json = { workspace = true }
url = { workspace = true }
halogen-local-runtime = { path = "../local-runtime" }
tokio = { workspace = true }
halogen-logging-client = { path = "../logging-client" }

uniffi = { workspace = true, features = ["tokio"] }

[features]
bindgen = ["uniffi/cli"]
