[package]
name = "halogen-ui-svc-sync"
version.workspace = true
edition.workspace = true

# The background sync worker: owns the canonical `EpisodeState`, pulls from the server,
# drains the offline outbox, applies optimistic mutations, spawns device downloads,
# and maps connectivity events to status. Also `poll_job` (admin poll orchestration
# + `PullPhase`). The heaviest UI service — consumes store/media/ws + commands.
[dependencies]
dioxus = { workspace = true }
halogen-api = { path = "../api" }
halogen-wire = { path = "../wire" }
halogen-utils = { path = "../utils" }
halogen-ui-appstate = { path = "../ui-appstate" }
halogen-ui-toast = { path = "../ui-toast" }
halogen-ui-logging = { path = "../ui-logging" }
halogen-ui-platform = { path = "../ui-platform" }
halogen-ui-config = { path = "../ui-config" }
halogen-ui-commands = { path = "../ui-commands" }
halogen-ui-svc-store = { path = "../ui-svc-store" }
halogen-ui-svc-media = { path = "../ui-svc-media" }
halogen-ui-svc-ws = { path = "../ui-svc-ws" }
anyhow = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Worker", "MessageEvent", "ErrorEvent"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }

[features]
web = ["dioxus/web", "halogen-ui-toast/web", "halogen-ui-config/web"]
desktop = ["dioxus/desktop", "halogen-ui-toast/desktop", "halogen-ui-config/desktop"]
