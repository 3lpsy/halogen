[package]
name = "halogen-ui-logging"
version.workspace = true
edition.workspace = true

# Device logging: the in-memory ring + `tracing` subscriber layer,
# capture/snapshot/search/export, and the persisted log store (IndexedDB web /
# file native). Re-exports the `tracing` macros under `logging::`. No dioxus;
# per-target deps are cfg-gated.
[dependencies]
halogen-ui-platform = { path = "../ui-platform" }
halogen-ui-idb = { path = "../ui-idb" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
idb = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
tracing-wasm = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlAnchorElement",
    "Blob", "BlobPropertyBag", "Url",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
