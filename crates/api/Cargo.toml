[package]
name     = "halogen-api"
version.workspace = true
edition.workspace = true

[dependencies]
halogen-wire = { path = "../wire" }
serde        = { workspace = true }
serde_json   = { workspace = true }
serde_qs     = { workspace = true }
thiserror    = "2"
url          = { workspace = true }
# Stream combinators for the "no chunking" download mode (body streamed, not buffered).
# Standalone (not the workspace dep): this crate compiles into the wasm UI graph and
# needs `default-features = false`, which a workspace-inherited dep can't override.
futures-util = { version = "0.3.32", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { workspace = true, features = ["json", "stream"] }

# Native-only: `ApiError::is_offline`'s test needs a REAL `reqwest::Error` (the
# type has no public constructor), which means actually failing a connect.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true }
