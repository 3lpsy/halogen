[package]
name = "halogen-ui-config"
version.workspace = true
edition.workspace = true

# Local-only client configuration + settings: `ClientConfig` + its per-user
# namespaced store, the preference value types, the remembered list-view store,
# `api_client_from`, and the mutate-and-persist `config_actions`. IndexedDB on
# web / JSON files on native. A settings layer, not a service.
[dependencies]
dioxus = { workspace = true }
halogen-api = { path = "../api" }
halogen-wire = { path = "../wire" }
halogen-utils = { path = "../utils" }
halogen-ui-logging = { path = "../ui-logging" }
halogen-ui-platform = { path = "../ui-platform" }
halogen-ui-idb = { path = "../ui-idb" }
halogen-ui-listview = { path = "../ui-listview" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
idb = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

[features]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[dev-dependencies]
futures = { workspace = true }
